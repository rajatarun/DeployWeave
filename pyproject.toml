[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deployweave"
version = "0.2.0"
description = "Serverless & local-first agent deployment, token-wallet reservation, and lifecycle management."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]
mcp = [
    "fastmcp>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0",
    "ruff>=0.4.0",
]
all = [
    "deployweave[aws,mcp,dev]",
]

[project.scripts]
deployweave-wallet = "deployweave.cli:main"

[tool.setuptools]
packages = ["deployweave"]
py-modules = [
    "cleanup_lambda",
    "deployweave_mcp",
    "invocation_gateway",
    "lora_validator",
    "observatory_metrics",
    "orphan_reconciliation",
    "reservation_cleanup",
    "reservation_manager",
    "sqlite_reservation_manager",
    "streams_to_sqs",
    "threshold_alerter",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E402"]
"examples/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

