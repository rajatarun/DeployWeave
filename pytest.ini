[pytest]
# unit_tests.py predates the test_*.py files and does not match pytest's default
# python_files glob, so a bare `pytest` silently skipped all 85 of its tests while
# CI — which named that one file explicitly — silently skipped every other test
# file. Neither invocation ran the whole suite, and a contract test that CI never
# runs cannot catch the drift it exists to catch. Naming both patterns here means
# `pytest` with no arguments collects everything, so the next test file added is
# picked up without anyone having to remember to edit a workflow.
python_files = test_*.py unit_tests.py
