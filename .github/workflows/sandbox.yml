name: Sandbox (Feature Branches)

on:
  push:
    branches-ignore:
      - main

permissions:
  id-token: write   # required for AWS OIDC token exchange
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # pip's default is a single attempt per index request, so one bad
      # response from PyPI fails the whole job. That is what happened on run
      # #12: `boto3>=1.34.0 (from versions: none)` while fastmcp had resolved
      # from the same index seconds earlier. boto3 has 679 releases at or above
      # 1.34 -- "no versions" was the index failing to answer, not the
      # requirement being unsatisfiable.
      #
      # --retries with a backoff makes that self-healing. It cannot mask a
      # genuinely missing package: a requirement with no matching release still
      # fails, just five attempts later.
      - name: Install dependencies
        run: pip install --retries 5 --timeout 30 -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -v

  deploy-sandbox:
    name: Deploy Sandbox
    runs-on: ubuntu-latest
    needs: test
    environment: sandbox
    outputs:
      stack-name: ${{ steps.stack-name.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Derive stack name from branch
        id: stack-name
        # CloudFormation stack names: alphanumeric + hyphens, max 128 chars.
        # Sanitise branch name: replace non-alphanumeric runs with hyphens,
        # lowercase, prefix, truncate so the full name stays under 128 chars.
        run: |
          BRANCH="${{ github.ref_name }}"
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//' | cut -c1-100)
          STACK="deployweave-sb-${SLUG}"
          echo "value=${STACK}" >> "$GITHUB_OUTPUT"
          echo "Stack name: ${STACK}"

          # Four tables and two queues are named globally rather than per
          # environment, so a sandbox stack tried to create the ones the dev
          # stack already owns and the changeset failed EarlyValidation
          # ResourceExistenceCheck. ResourceSuffix (default "", so dev and prod
          # are untouched) makes this stack's six unique.
          #
          # Cut to 40, not the 100 used for the stack name: SQS caps a queue
          # name at 80 characters and "deployweave-cleanup-queue" already
          # spends 25, so 25 + 4 + 40 = 69 leaves margin. A stack name may run
          # to 128, which is why the two slugs differ.
          SUFFIX="-sb-$(echo "$SLUG" | cut -c1-40 | sed 's/-$//')"
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Resource suffix: ${SUFFIX}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
          aws-region: us-east-1
          role-session-name: deployweave-sb-${{ github.run_id }}

      - name: SAM Build
        run: sam build --use-container --template deployment.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --stack-name ${{ steps.stack-name.outputs.value }} \
            --parameter-overrides Environment=sandbox ResourceSuffix=${{ steps.stack-name.outputs.suffix }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region us-east-1

  teardown-sandbox:
    name: Teardown Sandbox (60 min TTL)
    runs-on: ubuntu-latest
    needs: deploy-sandbox
    environment: sandbox
    if: always() && needs.deploy-sandbox.result == 'success'

    steps:
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
          aws-region: us-east-1
          role-session-name: deployweave-sb-teardown-${{ github.run_id }}

      - name: Wait 60 minutes
        run: sleep 3600

      - name: Delete sandbox stack
        run: |
          sam delete \
            --stack-name ${{ needs.deploy-sandbox.outputs.stack-name }} \
            --no-prompts \
            --region us-east-1
